<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title description">
  <title id="title">Prince Math Academy logo</title>
  <desc id="description">A three-dimensional royal blue shield with a gold crown, open book and Prince Math Academy lettering</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd45a"/>
      <stop offset=".5" stop-color="#fdbd2d"/>
      <stop offset="1" stop-color="#e9a91d"/>
    </linearGradient>
    <linearGradient id="blue" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#1d4f94"/>
      <stop offset=".48" stop-color="#16377a"/>
      <stop offset="1" stop-color="#0b2456"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315fa3"/>
      <stop offset=".5" stop-color="#16377a"/>
      <stop offset="1" stop-color="#0b2456"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#bdcce9"/>
    </linearGradient>
    <linearGradient id="monogram" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#315fa3"/>
      <stop offset=".38" stop-color="#16377a"/>
      <stop offset=".72" stop-color="#102b63"/>
      <stop offset="1" stop-color="#0b2456"/>
    </linearGradient>
    <linearGradient id="glass" x1=".12" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".24" stop-color="#cfe5ff" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#9fcaff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="11" flood-color="#06184b" flood-opacity=".34"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#06184b" flood-opacity=".3"/>
    </filter>
  </defs>

