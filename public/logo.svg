      <path d="M-38 60C-32 31-49 12-59-9l31 11 22-36 30 36 26-36 23 36 31-11c-11 27-27 45-31 69H-38Z" fill="#9e6500" opacity=".28" transform="translate(8 10)"/>
      <path d="M-38 50C-32 21-49 2-59-19l31 11 22-36 30 36 26-36 23 36 31-11c-11 27-27 45-31 69H-38Z" fill="url(#gold)" stroke="#fff1a1" stroke-width="2"/>
      <circle cx="-44" cy="-8" r="10" fill="url(#gold)"/>
      <circle cx="-6" cy="-42" r="10" fill="url(#gold)"/>
      <circle cx="34" cy="-42" r="10" fill="url(#gold)"/>
      <circle cx="74" cy="-8" r="10" fill="url(#gold)"/>
      <circle cx="0" cy="-63" r="11" fill="#ffc83d"/>
      <path d="M-46 38c21 10 44 12 66 4 20 8 42 6 66-4l-7 18c-39 18-79 18-118 0Z" fill="url(#gold)"/>
