    <path d="M260 116 378 159v91c0 63-31 115-118 155-87-40-118-92-118-155v-91Z" fill="url(#glass)"/>
    <path d="m151 174 109-40 103 38" fill="none" stroke="url(#glint)" stroke-linecap="round" stroke-width="8"/>
    <path d="M151 177v73c0 28 5 51 15 73" fill="none" stroke="#d7eaff" stroke-linecap="round" stroke-opacity=".46" stroke-width="5"/>
    <path d="M260 128v266" fill="none" stroke="#0b255e" stroke-width="3" opacity=".7"/>

