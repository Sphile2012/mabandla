<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" role="img" aria-labelledby="title desc">
  <title id="title">Prince Math Academy logo</title>
  <desc id="desc">A landscape Prince Math Academy wordmark with a royal blue shield emblem and gold accents.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#d89b1c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2f63b3"/>
      <stop offset="0.5" stop-color="#16377a"/>
      <stop offset="1" stop-color="#0b2456"/>
    </linearGradient>
    <linearGradient id="blueDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#295899"/>
      <stop offset="1" stop-color="#081a3d"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e6ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4f9c"/>
      <stop offset="1" stop-color="#0b2456"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#06184b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(28 8) scale(0.92)">
