        <path d="M-24 34c3-16-6-27-11-39l18 6 13-21 17 21 15-21 13 21 18-6c-6 16-15 27-17 39z" fill="#b7791f" opacity="0.28" transform="translate(5 5)"/>
        <path d="M-24 30c3-16-6-27-11-39l18 6 13-21 17 21 15-21 13 21 18-6c-6 16-15 27-17 39z" fill="url(#gold)" stroke="#fff1b8" stroke-width="1.5"/>
        <circle cx="-22" cy="-2" r="6" fill="url(#gold)"/>
        <circle cx="0" cy="-21" r="6" fill="url(#gold)"/>
        <circle cx="23" cy="-21" r="6" fill="url(#gold)"/>
        <circle cx="45" cy="-2" r="6" fill="url(#gold)"/>
        <circle cx="12" cy="-34" r="6.5" fill="#ffc94d"/>
        <path d="M-25 22c12 6 25 7 38 2 11 5 24 4 38-2l-4 10c-22 10-45 10-68 0z" fill="url(#gold)"/>
      </g>

      <path d="M86 34 164 62v56c0 44-22 78-78 104-56-26-78-60-78-104V62z" fill="url(#blueDeep)" stroke="#06184b" stroke-width="5" stroke-linejoin="round"/>
      <path d="M86 46 152 70v48c0 38-18 67-66 90-48-23-66-52-66-90V70z" fill="url(#blue)" stroke="#8fb6e8" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M86 46 152 70v48c0 38-18 67-66 90-48-23-66-52-66-90V70z" fill="url(#shine)"/>
      <path d="M86 54v140" stroke="#0b2456" stroke-width="2" opacity="0.55"/>

      <path d="M49 92h31c21 0 35 13 35 33 0 21-14 34-36 34h-9v31c0 14 6 17 18 17v7H35v-7c10 0 15-4 15-17v-68c0-13-5-17-15-18v-12Zm21 12v43h6c12 0 19-8 19-21s-6-22-18-22Z" fill="#ffffff" fill-opacity="0.96"/>
      <path d="M49 92h31c21 0 35 13 35 33 0 21-14 34-36 34h-9v31c0 14 6 17 18 17v7H35v-7c10 0 15-4 15-17v-68c0-13-5-17-15-18v-12Zm21 12v43h6c12 0 19-8 19-21s-6-22-18-22Z" fill="url(#shine)" opacity="0.35"/>

      <text x="40" y="148" fill="#dfeeff" font-family="Georgia, serif" font-size="24" font-weight="700">Σ</text>
      <text x="123" y="148" fill="#dfeeff" font-family="Georgia, serif" font-size="22" font-weight="700">π</text>

      <path d="M86 182c-22-24-49-33-79-27 6 25 19 41 37 50 17 8 31 10 42 8z" fill="#123a7a" stroke="#06184b" stroke-width="2.5"/>
      <path d="M86 182c22-24 49-33 79-27-6 25-19 41-37 50-17 8-31 10-42 8z" fill="#123a7a" stroke="#06184b" stroke-width="2.5"/>
      <path d="M86 206c-17-17-42-27-74-31 15 10 25 21 34 27 15 9 27 11 40 4z" fill="url(#page)" stroke="#b9d2ff" stroke-width="1.5"/>
      <path d="M86 206c17-17 42-27 74-31-15 10-25 21-34 27-15 9-27 11-40 4z" fill="url(#page)" stroke="#b9d2ff" stroke-width="1.5"/>
      <path d="M86 206c-18-14-41-24-71-29" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
      <path d="M86 206c18-14 41-24 71-29" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(240 58)">
    <text x="0" y="72" fill="url(#wordMain)" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="5">PRINCE</text>
    <rect x="4" y="94" width="360" height="6" rx="3" fill="url(#gold)"/>
    <rect x="374" y="94" width="360" height="6" rx="3" fill="#d8e6ff" opacity="0.9"/>
    <text x="2" y="144" fill="#1b4b93" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" letter-spacing="8">MATH ACADEMY</text>
