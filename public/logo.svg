      <path d="M194 148h54c35 0 58 21 58 54 0 35-24 56-60 56h-15v53c0 24 10 29 31 29v12h-88v-12c18-1 25-8 25-29V192c0-21-7-28-25-30v-14Zm37 19v71h10c20 0 31-13 31-35 0-23-10-36-30-36Z" fill="url(#monogram)" stroke="#06184b" stroke-width="5" stroke-linejoin="round"/>
      <path d="M194 148h54c35 0 58 21 58 54 0 35-24 56-60 56h-15v53c0 24 10 29 31 29v12h-88v-12c18-1 25-8 25-29V192c0-21-7-28-25-30v-14Zm37 19v71h10c20 0 31-13 31-35 0-23-10-36-30-36Z" fill="url(#glass)" opacity=".42"/>
    </g>

    <g fill="#09275f" font-family="Georgia, serif" font-size="45" font-weight="700" text-anchor="middle">
      <text x="181" y="245">Σ</text>
      <text x="339" y="246">×</text>
    </g>

    <g filter="url(#soft)">
      <path d="M260 390c-43-47-96-63-154-52 10 47 34 78 69 95 33 16 62 20 85 15Z" fill="#071b50" stroke="#06184b" stroke-width="5"/>
      <path d="M260 390c43-47 96-63 154-52-10 47-34 78-69 95-33 16-62 20-85 15Z" fill="#071b50" stroke="#06184b" stroke-width="5"/>
      <path d="M260 438c-19-26-62-57-154-66 28 16 47 37 66 50 32 21 60 26 88 16Z" fill="#164da2"/>
      <path d="M260 438c19-26 62-57 154-66-28 16-47 37-66 50-32 21-60 26-88 16Z" fill="#164da2"/>
      <path d="M260 438c-31-30-78-48-142-57" fill="none" stroke="#ffc52d" stroke-width="7" stroke-linecap="round"/>
      <path d="M260 438c31-30 78-48 142-57" fill="none" stroke="#ffc52d" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <g text-anchor="middle" filter="url(#soft)">
    <text x="260" y="354" fill="#06184b" stroke="#06184b" stroke-width="1" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="7">PRINCE</text>
    <path d="M84 372h91M345 372h91" stroke="#f5ad18" stroke-width="5" stroke-linecap="round"/>
    <circle cx="175" cy="372" r="4" fill="#f5ad18"/>
    <circle cx="345" cy="372" r="4" fill="#f5ad18"/>
    <text x="260" y="399" fill="#0a2d75" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="2">MATH ACADEMY</text>
  </g>
