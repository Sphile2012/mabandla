[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # In production, call the Netlify function directly (avoids relying on redirects)
  VITE_API_BASE_URL = "/.netlify/functions/api/api"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[functions.api]
  timeout = 26

# Disable secrets scanning — secrets are stored in Netlify env vars, not in code
[build.processing]
  skip_processing = false

# Redirect all /api/* calls to the Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = false
