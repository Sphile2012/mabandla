[build]
  command = "npm install && cd netlify/functions && npm install && cd ../.. && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "true"
  # Non-sensitive/public values expected in source or client bundle; avoid false-positive secrets scan failures.
  # Do not add real secret keys (service role, JWT, PayFast/SMTP credentials, etc.).
  SECRETS_SCAN_OMIT_KEYS = "APP_ORIGIN,ADMIN_EMAIL,VITE_API_BASE_URL,SMTP_HOST"
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "/api"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/node_modules/**"]

[functions.api]
  timeout = 26
  external_node_modules = ["bcryptjs", "nodemailer"]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - Allow necessary resources while maintaining security
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://*.netlify.app; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za;"
    # Strict-Transport-Security - Force HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # X-Content-Type-Options - Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5000
  publish = "dist"
  autoLaunch = false
