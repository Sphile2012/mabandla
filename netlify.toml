[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Must match src/api/client.js: paths are like /auth/me → full URL /api/auth/me
  VITE_API_BASE_URL = "/api"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[functions.api]
  timeout = 26

# Disable secrets scanning — secrets are stored in Netlify env vars, not in code
[build.processing]
  skip_processing = false

# Proxy /api/* to the serverless Express app (function file: netlify/functions/api.js)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = false
