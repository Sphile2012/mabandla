[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "/api"

[functions]
  node_bundler = "esbuild"

[functions.api]
  timeout = 26
  external_node_modules = ["bcryptjs"]

# Security Headers - Prevent Chrome blocking and improve security
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - Allow necessary resources while maintaining security
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' https://*.supabase.co https://*.netlify.app; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    # Strict-Transport-Security - Force HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # X-Content-Type-Options - Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # X-Frame-Options - Prevent clickjacking
    X-Frame-Options = "DENY"
    # X-XSS-Protection - XSS protection
    X-XSS-Protection = "1; mode=block"
    # Referrer-Policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions-Policy - Control browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    # Cache control for static assets
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache JS and CSS files
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker should not be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest should not be cached for long
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Icons should be cached
[[headers]]
  for = "/icon*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect all /api/* calls to the Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = false
