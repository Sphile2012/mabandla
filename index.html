  <!-- Screen Orientation Lock Script -->
  <script>
    (function() {
      function lockOrientation() {
        if ('orientation' in screen && typeof screen.orientation === 'object') {
          screen.orientation.lock('portrait-primary').catch(function(err) {
            console.log('Screen orientation lock not available:', err.message);
          });
        }
      }
      function isMobile() {
        return (
          typeof window.orientation !== 'undefined' ||
          navigator.userAgent.indexOf('IEMobile') !== -1 ||
          /Mobi|Android|iPhone|iPad|iPod|BlackBerry|webOS/i.test(navigator.userAgent)
        );
      }
      if (isMobile()) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', lockOrientation);
        } else {
          lockOrientation();
        }
        window.addEventListener('orientationchange', function() {
          setTimeout(lockOrientation, 100);
        });
      }
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(function (registration) {
            console.log('[SW] Registered:', registration.scope);
            const spinner = document.getElementById('loading-spinner');
            if (spinner) setTimeout(function () { spinner.style.display = 'none'; }, 500);
          })
          .catch(function (error) {
            console.log('[SW] Registration failed:', error);
          });
      });
    } else {
      const spinner = document.getElementById('loading-spinner');
      if (spinner) setTimeout(function () { spinner.style.display = 'none'; }, 500);
    }
  </script>
